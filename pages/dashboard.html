<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src https://*.supabase.co https://api.ipify.org; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Andrux Dashboard</title>
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-page="dashboard">
<section id="appShell" class="app-shell">
<div class="mobile-bar">
<button id="mobileMenu" class="menu-btn" aria-label="Menu" data-i18n="nav.menu">菜单</button>
<strong>Andrux</strong>
<button id="mobileLogout" class="ghost-btn" data-i18n="nav.exit">退出</button>
</div>
<aside id="sidebar" class="sidebar">
<div class="side-head">
<div class="brand-mark">AX</div>
<div class="side-title">
<strong>Andrux</strong>
<small data-i18n="nav.player_center">玩家中心</small>
</div>
</div>
<nav class="nav-group" aria-label="Pages">
<button class="nav-btn active" data-page="dashboard" data-href="./dashboard.html"><span data-i18n="nav.dashboard">仪表盘</span><span class="nav-code">01</span></button>
<button class="nav-btn" data-page="game" data-href="./game.html"><span data-i18n="nav.game">游戏</span><span class="nav-code">02</span></button>
<button class="nav-btn" data-page="executor" data-href="./executor.html"><span data-i18n="nav.executor">执行器</span><span class="nav-code">03</span></button>
<button class="nav-btn" data-page="community" data-href="./community.html"><span data-i18n="nav.community">社区</span><span class="nav-code">04</span></button>
<button class="nav-btn" data-page="admin" data-href="./admin.html"><span data-i18n="nav.admin">管理员</span><span class="nav-code">05</span></button>
<button class="nav-btn" data-page="profile" data-href="./profile.html"><span data-i18n="nav.profile">主页</span><span class="nav-code">06</span></button>
<button class="nav-btn" data-page="settings" data-href="./settings.html"><span data-i18n="nav.settings">设置</span><span class="nav-code">07</span></button>
<button class="nav-btn" data-page="roblox-whitelist" data-href="./roblox-whitelist.html"><span>Roblox 白名单</span><span class="nav-code">08</span></button>
</nav>
<div class="side-foot">
<div class="user-card">
<b id="sideUsername">Player</b>
<span data-i18n="nav.logged_in">已登录，社区权限已开启</span>
</div>
<button id="logoutBtn" class="ghost-btn" data-i18n="nav.logout">退出登录</button>
</div>
</aside>
<main class="content">
<section id="dashboardPage" class="page active">
<div class="page-header">
<div>
<span class="eyebrow" data-i18n="dash.eyebrow">控制台</span>
<h2 data-i18n="dash.title">Andrux 仪表盘</h2>
<p class="subtext" data-i18n="dash.desc">这里是登录后的主页面，用来展示玩家状态、社区安全策略和当前系统保护。页面只在登录或注册后开放。</p>
</div>
</div>
<div class="grid metrics">
<div class="card metric"><b id="metricUsers">0</b><span data-i18n="dash.online_users">在线用户</span></div>
<div class="card metric"><b id="metricMessages">0</b><span data-i18n="dash.community_msgs">社区消息</span></div>
<div class="card metric"><b>3</b><span data-i18n="dash.chat_channels">聊天分区</span></div>
<div class="card metric"><b>60</b><span data-i18n="dash.recall_window">秒内可撤回</span></div>
</div>
<div class="dashboard-layout">
<div class="card">
<span class="eyebrow" data-i18n="dash.sys_status">系统状态</span>
<h3 data-i18n="dash.access_open">访问已开启</h3>
<p class="subtext" data-i18n="dash.access_desc">你已进入 Andrux 玩家中心，可以查看仪表盘并进入社区页面。未登录用户只会看到登录和注册入口。</p>
</div>
</div>
</section>
</main>
</section>
<div id="contextMenu" class="context-menu">
<button data-action="recall" data-i18n="comm.recall">撤回</button>
<button data-action="quote" data-i18n="comm.quote">引用</button>
<button data-action="copy" data-i18n="comm.copy">复制</button>
</div>
<div id="fileContextMenu" class="context-menu">
<button data-file-action="remove" data-i18n="comm.file_remove">删除文件</button>
</div>
<div id="toast" class="toast" data-i18n="misc.notice">提示</div>
<script src="../assets/i18n.js?v=13"></script>
<script src="../assets/polyfill.js?v=13"></script>
<script src="../assets/page-app.js"></script>
<script src="../assets/game-fix.js?v=12"></script>
</body>
</html>
