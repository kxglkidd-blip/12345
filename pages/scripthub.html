<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src https://*.supabase.co https://api.ipify.org https://users.roproxy.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Andrux Script Hub</title>
<link rel="stylesheet" href="../assets/styles.css?v=13">
<style>
:root{--surface:#fffaf1;}

.sh-header-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.sh-server-select{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;flex:1;min-width:240px}
.sh-server-select label{font-size:12px;color:var(--muted);white-space:nowrap}
.sh-server-select select{flex:1;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px}
.sh-search-box{display:flex;align-items:center;gap:10px;flex:2;min-width:260px}
.sh-search-box input{width:100%;padding:11px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font-size:13px}
.sh-add-btn{padding:11px 20px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sh-add-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}

.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:16px}
.sh-card{cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden;transition:all .25s ease;position:relative;display:flex;flex-direction:column;min-height:220px;box-shadow:0 4px 12px rgba(0,0,0,.04)}
.sh-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.12);border-color:var(--accent)}
.sh-card-cover{height:110px;width:100%;position:relative;background:linear-gradient(135deg,#1f2430 0%,#11141c 100%);background-size:cover;background-position:center;overflow:hidden}
.sh-card-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(15,18,25,.85) 100%)}
.sh-card-badge{position:absolute;top:10px;right:10px;z-index:2;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.sh-badge-require{background:linear-gradient(135deg,#e67e22,#d35400);color:#fff}
.sh-badge-script{background:linear-gradient(135deg,#2980b9,#16a085);color:#fff}
.sh-card-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface)}
.sh-card-info h4{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-card-info p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.sh-card-actions{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--rule);gap:8px}
.sh-exec-btn{flex:1;padding:9px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.sh-exec-btn:hover{filter:brightness(1.15);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.sh-exec-btn:active{transform:scale(.98)}
.sh-del-btn{padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s}
.sh-del-btn:hover{background:rgba(231,76,60,.1);color:#e74c3c;border-color:#e74c3c}

/* Modal */
.sh-modal-mask {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  background: rgba(18, 14, 10, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex !important;
  align-items: center;
  justify-content: center;
  z-index: 999999 !important;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .25s cubic-bezier(.2,.8,.2,1), visibility .25s;
  padding: 16px;
  margin: 0 !important;
  box-sizing: border-box;
  /* 脱离任何 transform 祖先的影响 */
  transform: none !important;
}
.sh-modal-mask.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
/* 防止被侧边栏或其它层挡住 */
body > .sh-modal-mask {
  z-index: 999999 !important;
}
.sh-modal {
  background: #fffaf1 !important;
  border: 1px solid #ded4c3 !important;
  border-radius: 24px !important;
  width: 100%;
  max-width: 520px;
  padding: 28px 26px !important;
  box-shadow: 0 28px 80px rgba(33, 26, 16, 0.35) !important;
  transform: scale(0.96) translateY(10px);
  transition: transform .25s cubic-bezier(.2,.8,.2,1);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
  box-sizing: border-box;
}
.sh-modal-mask.open .sh-modal {
  transform: scale(1) translateY(0);
}
.sh-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid #ded4c3;
}
.sh-modal-header h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  color: #17130d;
  letter-spacing: -0.02em;
}
.sh-close-btn {
  background: rgba(23, 19, 13, 0.06);
  border: 1px solid #ded4c3;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  color: #746d61;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
}
.sh-close-btn:hover {
  background: rgba(23, 19, 13, 0.12);
  color: #17130d;
  transform: rotate(90deg);
}
.sh-form-group {
  margin-bottom: 16px;
}
.sh-form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #746d61;
  margin-bottom: 7px;
  letter-spacing: .02em;
}
.sh-form-group input, 
.sh-form-group select, 
.sh-form-group textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 14px;
  border: 1px solid #ded4c3;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.85);
  color: #17130d;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: all .2s;
}
.sh-form-group input:focus, 
.sh-form-group select:focus, 
.sh-form-group textarea:focus {
  border-color: #203a33;
  box-shadow: 0 0 0 4px rgba(32, 58, 51, 0.12);
  background: #ffffff;
}
.sh-form-group textarea {
  resize: vertical;
  min-height: 72px;
  line-height: 1.5;
}
#cardContent {
  font-family: 'Geist Mono', Consolas, monospace !important;
  font-size: 12px;
  background: #17130d !important;
  color: #d6e4d5 !important;
  border-color: #17130d !important;
  min-height: 90px;
}
#cardContent::placeholder {
  color: rgba(214, 228, 213, 0.45) !important;
  opacity: 1;
}
#cardContent:focus {
  border-color: #203a33 !important;
  box-shadow: 0 0 0 4px rgba(32, 58, 51, 0.25) !important;
}
.sh-modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 24px;
  padding-top: 14px;
  border-top: 1px solid #ded4c3;
}
.sh-modal-btn-cancel {
  border: 1px solid #ded4c3 !important;
  border-radius: 14px !important;
  padding: 10px 20px !important;
  background: rgba(255, 255, 255, 0.6) !important;
  color: #746d61 !important;
  font-weight: 700 !important;
  font-size: 13px !important;
  cursor: pointer !important;
  transition: all .2s;
}
.sh-modal-btn-cancel:hover {
  background: rgba(255, 255, 255, 0.9) !important;
  color: #17130d !important;
}
.sh-modal-btn-save {
  border: none !important;
  border-radius: 14px !important;
  padding: 10px 24px !important;
  background: #203a33 !important;
  color: #fffaf1 !important;
  font-weight: 700 !important;
  font-size: 13px !important;
  cursor: pointer !important;
  box-shadow: 0 4px 14px rgba(32, 58, 51, 0.25) !important;
  transition: all .2s;
}
.sh-modal-btn-save:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}
</style>
</head>
<body data-page="scripthub">
<section id="appShell" class="app-shell">
<div class="mobile-bar">
<button id="mobileMenu" class="menu-btn" aria-label="Menu" data-i18n="nav.menu">菜单</button>
<strong>Andrux</strong>
<button id="mobileLogout" class="ghost-btn" data-i18n="nav.exit">退出</button>
</div>
<aside id="sidebar" class="sidebar">
<div class="side-head">
<div class="brand-mark">AX</div>
<div class="side-title">
<strong>Andrux</strong>
<small data-i18n="nav.player_center">玩家中心</small>
</div>
</div>
<nav class="nav-group" aria-label="Pages">
<button class="nav-btn" data-page="dashboard" data-href="./dashboard.html"><span data-i18n="nav.dashboard">仪表盘</span><span class="nav-code">01</span></button>
<button class="nav-btn" data-page="game" data-href="./game.html"><span data-i18n="nav.game">游戏</span><span class="nav-code">02</span></button>
<button class="nav-btn" data-page="executor" data-href="./executor.html"><span data-i18n="nav.executor">执行器</span><span class="nav-code">03</span></button>
<button class="nav-btn active" data-page="scripthub" data-href="./scripthub.html"><span data-i18n="nav.scripthub">脚本中心</span><span class="nav-code">04</span></button>
<button class="nav-btn" data-page="community" data-href="./community.html"><span data-i18n="nav.community">社区</span><span class="nav-code">05</span></button>
<button class="nav-btn" data-page="admin" data-href="./admin.html"><span data-i18n="nav.admin">管理员</span><span class="nav-code">06</span></button>
<button class="nav-btn" data-page="profile" data-href="./profile.html"><span data-i18n="nav.profile">主页</span><span class="nav-code">07</span></button>
<button class="nav-btn" data-page="settings" data-href="./settings.html"><span data-i18n="nav.settings">设置</span><span class="nav-code">08</span></button>
<button class="nav-btn" data-page="roblox-whitelist" data-href="./roblox-whitelist.html"><span data-i18n="nav.roblox_whitelist">Roblox 白名单</span><span class="nav-code">09</span></button>
</nav>
<div class="side-foot">
<div class="user-card">
<b id="sideUsername">Player</b>
<span data-i18n="nav.logged_in">已登录，社区权限已开启</span>
</div>
<button id="logoutBtn" class="ghost-btn" data-i18n="nav.logout">退出登录</button>
</div>
</aside>
<main class="content">
<section id="scripthubPage" class="page active">
<div class="page-header">
<div>
<span class="eyebrow" data-i18n="sh.eyebrow">Script Hub</span>
<h2 data-i18n="sh.title_full">脚本中心 (Require & 脚本库)</h2>
</div>
</div>

<div class="sh-header-bar">
<div class="sh-server-select">
<label data-i18n="sh.target_server">目标服务器：</label>
<select id="shServerSelect"><option data-i18n="sh.loading">加载中...</option></select>
</div>
<div class="sh-search-box">
<input id="shSearchInput" type="text" data-i18n-ph="sh.search_ph" placeholder="搜索脚本或 Require 模块...">
</div>
<button id="shOpenAddModal" class="sh-add-btn">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
<span data-i18n="sh.add_card">上传/添加卡片</span>
</button>
</div>

<div id="shGrid" class="sh-grid">
<!-- 卡片通过 JS 动态生成 -->
</div>

</section>
</main>
</section>


<!-- 上传卡片弹窗 -->
<div id="shModal" class="sh-modal-mask">
<div class="sh-modal">
<div class="sh-modal-header">
<h3 id="modalTitle" data-i18n="sh.modal_add_title">添加 Require / 脚本卡片</h3>
<button id="shCloseModal" class="sh-close-btn">&times;</button>
</div>
<form id="shAddForm">
<div class="sh-form-group">
<label data-i18n="sh.card_type">卡片类型</label>
<select id="cardType">
<option value="require" data-i18n="sh.type_require">Require 模块 (Asset ID)</option>
<option value="script" data-i18n="sh.type_script">Lua 源代码脚本</option>
</select>
</div>
<div class="sh-form-group">
<label data-i18n="sh.card_name">脚本/模块名称</label>
<input type="text" id="cardTitle" data-i18n-ph="sh.card_name_ph" placeholder="例如：极速飞行模块 / 超级工具箱" required>
</div>
<div class="sh-form-group" id="cardContentGroup">
<label id="cardContentLabel" data-i18n="sh.content_label_require">Require 语句</label>
<textarea id="cardContent" data-i18n-ph="sh.content_ph_require" placeholder="例如: require(12345)" required></textarea>
</div>
<div class="sh-form-group">
<label data-i18n="sh.card_desc_label">卡片介绍与功能说明</label>
<textarea id="cardDesc" data-i18n-ph="sh.card_desc_ph" placeholder="简要说明此脚本或模块的功能效果..." rows="2"></textarea>
</div>
<div class="sh-form-group">
<label data-i18n="sh.card_bg_label">卡片背景图 URL (可选)</label>
<input type="url" id="cardBg" data-i18n-ph="sh.card_bg_ph" placeholder="https://example.com/cover.jpg (留空使用默认炫酷背景)">
</div>
<div class="sh-modal-foot">
<button type="button" id="shCancelBtn" class="sh-modal-btn-cancel" data-i18n="sh.cancel">取消</button>
<button type="submit" class="sh-modal-btn-save" data-i18n="sh.save_card">保存卡片</button>
</div>
</form>
</div>
</div>


<!-- 卡片详细内容弹窗 -->
<div id="shDetailModal" class="sh-modal-mask">
<div class="sh-modal" style="max-width:580px">
<div class="sh-modal-header">
<h3 id="detailTitle" data-i18n="sh.detail_title">脚本详情</h3>
<button id="shCloseDetailModal" class="sh-close-btn">&times;</button>
</div>
<div id="detailCover" class="sh-card-cover" style="height:140px;border-radius:10px;margin-bottom:14px"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
  <span id="detailBadge" class="sh-card-badge" style="position:static"></span>
  <span id="detailAuthor" style="font-size:12px;color:var(--muted)"></span>
</div>
<div class="sh-form-group">
  <label data-i18n="sh.detail_intro">详细介绍</label>
  <div id="detailDesc" style="font-size:13px;color:var(--ink);background:var(--bg);padding:10px 12px;border-radius:8px;border:1px solid var(--rule);line-height:1.6;white-space:pre-wrap;max-height:100px;overflow-y:auto"></div>
</div>
<div class="sh-form-group">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <label style="margin:0" data-i18n="sh.detail_content">脚本内容 / Require 语句</label>
    <button type="button" id="detailCopyBtn" class="pa-btn" style="padding:4px 10px;font-size:11px" data-i18n="sh.copy">📋 复制</button>
  </div>
  <pre id="detailContent" style="margin:0;font-size:12px;color:var(--ink);background:var(--bg);padding:10px 12px;border-radius:8px;border:1px solid var(--rule);font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:140px;overflow-y:auto"></pre>
</div>
<div class="sh-modal-foot" style="margin-top:16px">
  <button type="button" id="detailCloseBtn" class="pa-btn" style="background:transparent;border:1px solid var(--rule);padding:8px 16px" data-i18n="sh.close">关闭</button>
  <button type="button" id="detailExecBtn" class="sh-add-btn" style="border-radius:8px;padding:8px 24px" data-i18n="sh.exec_now">▶ 立即执行</button>
</div>
</div>
</div>

<div id="toast" class="toast" data-i18n="misc.notice">提示</div>

<script src="../assets/scripthub.js?v=25"></script>
</body>
</html>
