<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src https://*.supabase.co https://api.ipify.org https://users.roproxy.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Andrux Script Hub</title>
<link rel="stylesheet" href="../assets/styles.css?v=19">
<style>
:root{--surface:#fffaf1;--sh-radius:18px;--sh-ease:cubic-bezier(.22,1,.36,1);}

/* Header toolbar */
.sh-header-bar{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  margin-bottom:22px;padding:14px 16px;border-radius:var(--sh-radius);
  background:linear-gradient(135deg,rgba(255,250,241,.95),rgba(243,240,234,.9));
  border:1px solid var(--rule);box-shadow:0 4px 18px rgba(33,26,16,.04);
  animation:axFadeUp .4s var(--sh-ease) both;
}
.sh-server-select{
  display:flex;align-items:center;gap:10px;padding:0;background:transparent;border:none;
  flex:1;min-width:220px;
}
.sh-server-select label{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:600;}
.sh-server-select select{
  flex:1;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;
  background:#fff;color:var(--ink);font-size:13px;
  transition:border-color .2s,box-shadow .2s;
}
.sh-server-select select:focus{
  outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(32,58,51,.12);
}
.sh-search-box{display:flex;align-items:center;gap:10px;flex:2;min-width:240px;position:relative;}
.sh-search-box input{
  width:100%;padding:11px 16px 11px 40px;border:1px solid var(--rule);border-radius:12px;
  background:#fff;color:var(--ink);font-size:13px;transition:border-color .2s,box-shadow .2s;
}
.sh-search-box input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(32,58,51,.12);}
.sh-search-box::before{
  content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:14px;pointer-events:none;opacity:.7;
}
.sh-add-btn{
  padding:11px 20px;border:none;border-radius:12px;background:var(--accent2);color:#fffaf1;
  font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;
  white-space:nowrap;box-shadow:0 6px 18px rgba(32,58,51,.2);
  transition:transform .2s var(--sh-ease),box-shadow .2s,filter .2s;
}
.sh-add-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 10px 26px rgba(32,58,51,.28);}
.sh-add-btn:active{transform:scale(.97);}

/* Card grid */
.sh-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:20px;margin-top:8px;
}
.sh-card{
  cursor:pointer;background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--sh-radius);overflow:hidden;position:relative;
  display:flex;flex-direction:column;min-height:248px;
  box-shadow:0 6px 18px rgba(33,26,16,.05);
  transition:transform .3s var(--sh-ease),box-shadow .3s var(--sh-ease),border-color .25s;
  animation:axCardIn .42s var(--sh-ease) both;
}
.sh-grid .sh-card:nth-child(1){animation-delay:.03s}
.sh-grid .sh-card:nth-child(2){animation-delay:.06s}
.sh-grid .sh-card:nth-child(3){animation-delay:.09s}
.sh-grid .sh-card:nth-child(4){animation-delay:.12s}
.sh-grid .sh-card:nth-child(5){animation-delay:.15s}
.sh-grid .sh-card:nth-child(6){animation-delay:.18s}
.sh-grid .sh-card:nth-child(n+7){animation-delay:.21s}
.sh-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(33,26,16,.14);
  border-color:rgba(32,58,51,.35);
}
.sh-card-cover{
  height:118px;width:100%;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#203a33 0%,#11141c 55%,#6f4d2d 100%);
  background-size:cover;background-position:center;
  transition:transform .45s var(--sh-ease);
}
.sh-card:hover .sh-card-cover{transform:scale(1.05);}
.sh-card-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(15,18,25,.55) 55%,rgba(15,18,25,.88) 100%);
}
.sh-card-badge{
  position:absolute;top:12px;left:12px;z-index:2;
  font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.04em;
  backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.sh-badge-require{background:linear-gradient(135deg,#e67e22,#c0392b);color:#fff;}
.sh-badge-script{background:linear-gradient(135deg,#2980b9,#16a085);color:#fff;}
.sh-card-body{
  padding:16px 16px 14px;flex:1;display:flex;flex-direction:column;justify-content:space-between;
  background:var(--surface);gap:12px;
}
.sh-card-info h4{
  font-size:15px;font-weight:700;color:var(--ink);margin:0 0 6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em;
}
.sh-card-info p{
  font-size:12.5px;color:var(--muted);margin:0;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.4em;
}
.sh-card-meta{
  font-size:11px;color:var(--muted);margin-top:8px;
  display:flex;align-items:center;gap:6px;
}
.sh-card-meta::before{
  content:'';width:6px;height:6px;border-radius:50%;background:var(--accent2);opacity:.45;
}
.sh-card-actions{display:flex;align-items:center;gap:8px;margin-top:auto;}
.sh-exec-btn{
  flex:1;border:none;border-radius:12px;padding:10px 14px;
  background:var(--accent2);color:#fffaf1;font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(32,58,51,.18);
  transition:transform .2s,filter .2s,box-shadow .2s;
}
.sh-exec-btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 20px rgba(32,58,51,.25);}
.sh-exec-btn:active{transform:scale(.97);}
.sh-del-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid rgba(138,45,45,.2);
  background:rgba(138,45,45,.06);cursor:pointer;font-size:14px;
  display:grid;place-items:center;opacity:.75;
  transition:transform .2s,background .2s,opacity .2s,border-color .2s;
}
.sh-del-btn:hover{opacity:1;transform:scale(1.06);background:rgba(138,45,45,.14);border-color:rgba(138,45,45,.35);}

/* Modal mask */
.sh-modal-mask{
  position:fixed;inset:0;z-index:9999;display:none;place-items:center;
  background:rgba(23,19,13,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:20px;animation:axFadeIn .2s ease both;
}
.sh-modal-mask.open{display:grid;}
.sh-modal{
  width:min(560px,100%);max-height:min(88vh,720px);overflow:auto;
  background:linear-gradient(180deg,#fffefb 0%,#fffaf1 100%);
  border:1px solid var(--rule);border-radius:22px;
  box-shadow:0 24px 64px rgba(23,19,13,.22);
  padding:0;position:relative;
  animation:axScaleIn .34s var(--sh-ease) both;
}
.sh-modal-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 22px 12px;position:sticky;top:0;z-index:2;
  background:linear-gradient(180deg,#fffefb 70%,rgba(255,254,251,0));
}
.sh-modal-header h3{margin:0;font-size:18px;letter-spacing:-.02em;color:var(--ink);}
.sh-close-btn{
  width:36px;height:36px;border-radius:12px;border:1px solid var(--rule);
  background:rgba(255,255,255,.7);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;
  transition:background .2s,color .2s,transform .2s;
}
.sh-close-btn:hover{background:#fff;color:var(--ink);transform:rotate(90deg);}
.sh-modal-body{padding:4px 22px 8px;}
.sh-modal form,.sh-detail-body{padding:4px 22px 8px;}
.sh-form-group{margin-bottom:14px;}
.sh-form-group label{
  display:block;font-size:12px;font-weight:700;color:var(--muted);
  margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase;
}
.sh-form-group input,.sh-form-group select,.sh-form-group textarea{
  width:100%;padding:11px 14px;border:1px solid var(--rule);border-radius:12px;
  background:#fff;color:var(--ink);font-size:13px;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
}
.sh-form-group textarea{min-height:88px;resize:vertical;line-height:1.5;}
.sh-form-group input:focus,.sh-form-group select:focus,.sh-form-group textarea:focus{
  outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(32,58,51,.12);
}
.sh-modal-foot{
  display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;
  position:sticky;bottom:0;background:linear-gradient(0deg,#fffaf1 70%,rgba(255,250,241,0));
}
.sh-modal-btn-cancel{
  border:1px solid var(--rule)!important;border-radius:14px!important;padding:10px 18px!important;
  background:rgba(255,255,255,.7)!important;color:var(--muted)!important;font-weight:700!important;
  font-size:13px!important;cursor:pointer!important;transition:all .2s;
}
.sh-modal-btn-cancel:hover{background:#fff!important;color:var(--ink)!important;}
.sh-modal-btn-save{
  border:none!important;border-radius:14px!important;padding:10px 22px!important;
  background:var(--accent2)!important;color:#fffaf1!important;font-weight:700!important;
  font-size:13px!important;cursor:pointer!important;
  box-shadow:0 6px 18px rgba(32,58,51,.25)!important;transition:all .2s;
}
.sh-modal-btn-save:hover{filter:brightness(1.08);transform:translateY(-1px);}

/* Detail modal */
.sh-detail-modal{width:min(620px,100%);}
.sh-detail-hero{
  height:160px;margin:0 16px;border-radius:16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#203a33,#11141c 50%,#6f4d2d);
  background-size:cover;background-position:center;
  box-shadow:0 10px 28px rgba(23,19,13,.18);
}
.sh-detail-hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(15,18,25,.75));
}
.sh-detail-meta{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 22px 6px;flex-wrap:wrap;
}
.sh-detail-meta .sh-card-badge{position:static;}
.sh-detail-author{
  font-size:12px;color:var(--muted);font-weight:600;
  padding:4px 10px;border-radius:999px;background:rgba(32,58,51,.06);
}
.sh-detail-panel{
  background:#fff;border:1px solid var(--rule);border-radius:14px;
  padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.65;
  white-space:pre-wrap;max-height:120px;overflow:auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}
.sh-detail-code-wrap{position:relative;}
.sh-detail-code{
  margin:0;font-size:12.5px;color:#e8e2d6;background:rgba(23,19,13,.94);
  padding:14px 16px;border-radius:14px;border:1px solid rgba(0,0,0,.2);
  font-family:var(--font-mono),Consolas,monospace;white-space:pre-wrap;word-break:break-word;
  max-height:180px;overflow:auto;line-height:1.55;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.sh-detail-copy{
  border:1px solid var(--rule);background:#fff;border-radius:10px;
  padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink);
  transition:transform .15s,background .15s,border-color .15s;
}
.sh-detail-copy:hover{background:var(--bg2);border-color:var(--accent2);transform:translateY(-1px);}
.sh-detail-foot .sh-detail-exec{
  border:none;border-radius:14px;padding:11px 22px;background:var(--accent2);color:#fffaf1;
  font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(32,58,51,.22);
  transition:transform .2s,filter .2s;
}
.sh-detail-foot .sh-detail-exec:hover{filter:brightness(1.08);transform:translateY(-1px);}
.sh-detail-foot .sh-detail-close{
  border:1px solid var(--rule);border-radius:14px;padding:11px 18px;
  background:rgba(255,255,255,.75);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;
  transition:all .2s;
}
.sh-detail-foot .sh-detail-close:hover{color:var(--ink);background:#fff;}

@keyframes axCardIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes axScaleIn{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes axFadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes axFadeIn{from{opacity:0;}to{opacity:1;}}

@media(max-width:640px){
  .sh-header-bar{padding:12px;}
  .sh-grid{grid-template-columns:1fr;gap:14px;}
  .sh-detail-hero{height:120px;margin:0 12px;}
  .sh-modal{border-radius:18px;}
}
</style>
</head>

<!-- 上传卡片弹窗 -->
<div id="shModal" class="sh-modal-mask">
<div class="sh-modal">
<div class="sh-modal-header">
<h3 id="modalTitle" data-i18n="sh.modal_add_title">添加 Require / 脚本卡片</h3>
<button id="shCloseModal" class="sh-close-btn">&times;</button>
</div>
<form id="shAddForm">
<div class="sh-form-group">
<label data-i18n="sh.card_type">卡片类型</label>
<select id="cardType">

<option value="script" data-i18n="sh.type_script">Lua 源代码脚本</option>
</select>
</div>
<div class="sh-form-group">

<input type="text" id="cardTitle" data-i18n-ph="sh.card_name_ph" placeholder="例如：极速飞行模块 / 超级工具箱" required>
</div>

<textarea id="cardContent" data-i18n-ph="sh.content_ph_require" placeholder="例如: require(12345)" required></textarea>
</div>
<div class="sh-form-group">
<label data-i18n="sh.card_desc_label">卡片介绍与功能说明</label>
<textarea id="cardDesc" data-i18n-ph="sh.card_desc_ph" placeholder="简要说明此脚本或模块的功能效果..." rows="2"></textarea>
</div>
<div class="sh-form-group">
<label data-i18n="sh.card_bg_label">卡片背景图 URL (可选)</label>

<button type="submit" class="sh-modal-btn-save" data-i18n="sh.save_card">保存卡片</button>
</div>
</form>
</div>
</div>

</div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

  </div>
  <pre id="detailContent" style="margin:0;font-size:12px;color:var(--ink);background:var(--bg);padding:10px 12px;border-radius:8px;border:1px solid var(--rule);font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:140px;overflow-y:auto"></pre>
